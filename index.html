<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWorld - 국가별 키워드 영화 추천</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        cinema: {
                            950: '#09090b',
                            900: '#121217',
                            800: '#1c1c24',
                            700: '#272732',
                            accent: '#e11d48',
                            accentHover: '#be123c'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cinema-950 text-zinc-100 font-sans min-h-screen flex flex-col selection:bg-cinema-accent selection:text-white">

    <!-- 헤더 네비게이션 -->
    <header class="sticky top-0 z-40 bg-cinema-950/80 backdrop-blur-md border-b border-zinc-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="resetFilters()">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
                    <i data-lucide="film" class="w-5 h-5 text-white"></i>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">
                    CineWorld
                </span>
            </div>

            <div class="flex items-center gap-3">
                <button id="bookmarkViewBtn" onclick="toggleBookmarkView()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-cinema-800 hover:bg-cinema-700 text-sm font-medium text-zinc-200 transition-all border border-zinc-700/50">
                    <i data-lucide="bookmark" class="w-4 h-4 text-rose-400"></i>
                    <span class="hidden sm:inline">찜한 영화</span>
                    <span id="bookmarkCount" class="bg-rose-500/20 text-rose-400 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 히어로 & 검색 섹션 -->
    <section class="relative pt-10 pb-8 px-4 sm:px-6 lg:px-8 border-b border-zinc-800/60 bg-gradient-to-b from-cinema-900 to-cinema-950">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight mb-4">
                전 세계 영화를 <span class="text-rose-500">키워드</span>로 찾아보세요
            </h1>
            <p class="text-zinc-400 text-sm sm:text-base mb-8 max-w-2xl mx-auto">
                분위기, 장르, 테마 키워드를 입력하고 원하는 국가를 선택하면 맞춤형 영화를 추천해 드립니다.
            </p>

            <!-- 검색 바 -->
            <div class="relative max-w-2xl mx-auto mb-6">
                <div class="relative flex items-center">
                    <i data-lucide="search" class="w-5 h-5 text-zinc-400 absolute left-4 pointer-events-none"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="키워드 검색 (예: 반전, 타임루프, 가족, 힐링, 사이버펑크, 로맨스...)" 
                        class="w-full pl-12 pr-24 py-4 rounded-2xl bg-cinema-800 border border-zinc-700/80 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent shadow-xl transition-all text-sm sm:text-base"
                    >
                    <button 
                        id="clearSearchBtn" 
                        onclick="clearSearch()" 
                        class="hidden absolute right-20 p-1.5 text-zinc-400 hover:text-white rounded-lg"
                        title="검색어 지우기"
                    >
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                    <button 
                        onclick="handleSearch()" 
                        class="absolute right-2 px-4 py-2 bg-cinema-accent hover:bg-cinema-accentHover text-white font-medium rounded-xl text-sm transition-colors shadow-lg shadow-rose-600/20"
                    >
                        검색
                    </button>
                </div>
            </div>

            <!-- 추천 키워드 칩 -->
            <div class="flex flex-wrap items-center justify-center gap-2 text-xs sm:text-sm">
                <span class="text-zinc-500 mr-1 flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i> 인기 키워드:
                </span>
                <button onclick="applyKeyword('킬링타임')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#킬링타임</button>
                <button onclick="applyKeyword('반전')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#반전</button>
                <button onclick="applyKeyword('코미디')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#코미디</button>
                <button onclick="applyKeyword('액션')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#액션</button>
                <button onclick="applyKeyword('힐링')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#힐링</button>
                <button onclick="applyKeyword('공포')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#공포</button>
                <button onclick="applyKeyword('로맨스')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#로맨스</button>
                <button onclick="applyKeyword('타임루프')" class="keyword-chip px-3 py-1.5 rounded-full bg-cinema-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">#타임루프</button>
            </div>
        </div>
    </section>

    <!-- 국가 필터 및 정렬 컨트롤 바 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 국가 선택 탭 -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 no-scrollbar" id="countryTabs">
                <!-- 자바스크립트로 국가 버튼 렌더링 -->
            </div>

            <!-- 정렬 & 필터 상태 -->
            <div class="flex items-center justify-between md:justify-end gap-3 shrink-0">
                <span id="resultCount" class="text-sm text-zinc-400">총 <strong class="text-white">0</strong>편의 영화</span>
                <select id="sortSelect" onchange="renderMovies()" class="bg-cinema-800 border border-zinc-700 text-zinc-200 text-sm rounded-xl px-3.5 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500 cursor-pointer">
                    <option value="rating">평점 높은순</option>
                    <option value="year_desc">최신 개봉순</option>
                    <option value="year_asc">과거 개봉순</option>
                </select>
            </div>
        </div>

        <!-- 현재 적용된 필터 알림 배너 (찜한 영화 보기 모드 등) -->
        <div id="filterBanner" class="hidden mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-between">
            <div class="flex items-center gap-2.5 text-rose-300 text-sm font-medium">
                <i data-lucide="bookmark" class="w-4 h-4"></i>
                <span id="filterBannerText">찜한 영화 목록을 보고 있습니다.</span>
            </div>
            <button onclick="resetFilters()" class="text-xs bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg font-medium transition-colors">
                전체 영화로 돌아가기
            </button>
        </div>

        <!-- 영화 그리드 컨테이너 -->
        <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- 영화 카드가 동적으로 삽입됩니다 -->
        </div>

        <!-- 검색 결과 없음 상태 -->
        <div id="emptyState" class="hidden py-20 text-center">
            <div class="w-16 h-16 rounded-2xl bg-cinema-800 border border-zinc-700 flex items-center justify-center mx-auto mb-4 text-zinc-500">
                <i data-lucide="film" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-semibold text-zinc-200 mb-1">일치하는 추천 영화가 없습니다</h3>
            <p class="text-zinc-400 text-sm mb-6">다른 키워드로 검색하거나 국가 필터를 '전체'로 변경해 보세요.</p>
            <button onclick="resetFilters()" class="px-5 py-2.5 rounded-xl bg-cinema-800 hover:bg-cinema-700 text-white text-sm font-medium border border-zinc-700 transition-colors">
                필터 초기화
            </button>
        </div>
    </main>

    <!-- 영화 상세 모달 -->
    <div id="movieModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-cinema-900 border border-zinc-800 rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl transform transition-all relative max-h-[90vh] flex flex-col">
            <!-- 닫기 버튼 -->
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-black/60 hover:bg-black text-zinc-300 hover:text-white flex items-center justify-center backdrop-blur-md border border-white/10 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="overflow-y-auto" id="modalContent">
                <!-- 상세 내용 동적 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 푸터 -->
    <footer class="border-t border-zinc-800/80 bg-cinema-950 py-8 px-4 text-center text-zinc-500 text-xs sm:text-sm">
        <p>© 2026 CineWorld. 키워드 기반 국가별 큐레이션 영화 추천 서비스.</p>
    </footer>

                keywords: ["공포", "오컬트", "무속", "호러", "페이크다큐", "충격"],
                synopsis: "태국 산골마을에서 대대로 조상신을 모시는 무당 가문에 벌어진 미스터리한 현상을 다큐멘터리 팀이 밀착 취재하면서 겪는 끔찍한 공포.",
                reason: "나홍진 감독 기획, 태국 토속 신앙이 결합되어 숨 막히는 공포와 충격을 선사합니다.",
                gradient: "from-stone-900 via-emerald-950 to-black"
            },
            {
                id: 40,
                title: "피막",
                engTitle: "Pee Mak",
                country: "TH",
                year: 2013,
                rating: 8.3,
                director: "반종 피산다나쿤",
                genre: ["코미디", "공포", "로맨스"],
                keywords: ["코미디", "귀신", "병맛", "우정", "킬링타임", "유머"],
                synopsis: "전쟁터에서 살아 돌아온 피막과 네 명의 전우들. 하지만 고향 집에서 그들을 반기는 아름다운 아내 낙이 사실은 귀신이라는 소문이 돌기 시작한다.",
                reason: "무서움보다 배꼽 잡는 슬랩스틱 코미디와 순애보가 돋보이는 태국 역대 최고 흥행작입니다.",
                gradient: "from-purple-900 via-zinc-900 to-black"
            }
        ];

        // 앱 상태 관리
        let state = {
            selectedCountry: 'ALL',
            searchQuery: '',
            bookmarks: JSON.parse(localStorage.getItem('cineworld_bookmarks') || '[]'),
            isBookmarkView: false
        };

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderCountryTabs();
            updateBookmarkUI();
            renderMovies();

            // 엔터키 검색 이벤트
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keyup', (e) => {
                state.searchQuery = e.target.value.trim();
                toggleClearButton();
                if (e.key === 'Enter' || state.searchQuery === '') {
                    renderMovies();
                } else {
                    // 실시간 필터링 지원
                    renderMovies();
                }
            });

            // 모달 바깥 클릭 시 닫기
            document.getElementById('movieModal').addEventListener('click', (e) => {
                if (e.target.id === 'movieModal') {
                    closeModal();
                }
            });

            // ESC 키로 모달 닫기
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });

        // 국가 탭 렌더링
        function renderCountryTabs() {
            const container = document.getElementById('countryTabs');
            container.innerHTML = COUNTRIES.map(country => {
                const isSelected = state.selectedCountry === country.id;
                const baseClasses = "flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all cursor-pointer border";
                const activeClasses = isSelected 
                    ? "bg-rose-600 text-white border-rose-500 shadow-lg shadow-rose-600/25" 
                    : "bg-cinema-800/80 text-zinc-300 border-zinc-700/60 hover:bg-cinema-700 hover:text-white";
                
                return `
                    <button onclick="selectCountry('${country.id}')" class="${baseClasses} ${activeClasses}">
                        <span class="text-base">${country.flag}</span>
                        <span>${country.name}</span>
                    </button>
                `;
            }).join('');
        }

        // 국가 선택 핸들러
        function selectCountry(countryId) {
            state.selectedCountry = countryId;
            renderCountryTabs();
            renderMovies();
        }

        // 키워드 칩 클릭 핸들러
        function applyKeyword(keyword) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = keyword;
            state.searchQuery = keyword;
            state.isBookmarkView = false;
            updateFilterBanner();
            toggleClearButton();
            renderMovies();
        }

        // 검색 실행
        function handleSearch() {
            const searchInput = document.getElementById('searchInput');
            state.searchQuery = searchInput.value.trim();
            toggleClearButton();
            renderMovies();
        }

        // 검색어 지우기
        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            state.searchQuery = '';
            toggleClearButton();
            renderMovies();
        }

        function toggleClearButton() {
            const btn = document.getElementById('clearSearchBtn');
            if (state.searchQuery.length > 0) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        // 전체 필터 초기화
        function resetFilters() {
            state.selectedCountry = 'ALL';
            state.searchQuery = '';
            state.isBookmarkView = false;
            document.getElementById('searchInput').value = '';
            toggleClearButton();
            updateFilterBanner();
            renderCountryTabs();
            renderMovies();
        }

        // 찜한 영화 보기 토글
        function toggleBookmarkView() {
            state.isBookmarkView = !state.isBookmarkView;
            updateFilterBanner();
            renderMovies();
        }

        function updateFilterBanner() {
            const banner = document.getElementById('filterBanner');
            const btn = document.getElementById('bookmarkViewBtn');
            if (state.isBookmarkView) {
                banner.classList.remove('hidden');
                btn.classList.add('ring-2', 'ring-rose-500', 'bg-cinema-700');
            } else {
                banner.classList.add('hidden');
                btn.classList.remove('ring-2', 'ring-rose-500', 'bg-cinema-700');
            }
        }

        // 찜하기 토글
        function toggleBookmark(event, movieId) {
            event.stopPropagation();
            const index = state.bookmarks.indexOf(movieId);
            const movie = MOVIES.find(m => m.id === movieId);

            if (index === -1) {
                state.bookmarks.push(movieId);
                showToast(`'${movie.title}' 영화를 찜 목록에 추가했습니다.`);
            } else {
                state.bookmarks.splice(index, 1);
                showToast(`'${movie.title}' 영화를 찜 목록에서 제거했습니다.`);
            }

            localStorage.setItem('cineworld_bookmarks', JSON.stringify(state.bookmarks));
            updateBookmarkUI();
            renderMovies();
        }

        function updateBookmarkUI() {
            document.getElementById('bookmarkCount').textContent = state.bookmarks.length;
        }

        // 영화 목록 필터링 및 렌더링
        function renderMovies() {
            const grid = document.getElementById('movieGrid');
            const emptyState = document.getElementById('emptyState');
            const resultCountEl = document.getElementById('resultCount');
            const sortBy = document.getElementById('sortSelect').value;

            // 1. 필터링
            let filtered = MOVIES.filter(movie => {
                // 찜 모드 필터
                if (state.isBookmarkView && !state.bookmarks.includes(movie.id)) {
                    return false;
                }

                // 국가 필터
                if (state.selectedCountry !== 'ALL' && movie.country !== state.selectedCountry) {
                    return false;
                }

                // 키워드 검색 필터 (제목, 영문제목, 감독, 장르, 키워드, 줄거리 검색)
                if (state.searchQuery) {
                    const q = state.searchQuery.toLowerCase().replace(/^#/, '');
                    const matchTitle = movie.title.toLowerCase().includes(q);
                    const matchEng = movie.engTitle.toLowerCase().includes(q);
                    const matchDirector = movie.director.toLowerCase().includes(q);
                    const matchGenre = movie.genre.some(g => g.toLowerCase().includes(q));
                    const matchKeyword = movie.keywords.some(k => k.toLowerCase().includes(q));
                    const matchSynopsis = movie.synopsis.toLowerCase().includes(q);

                    return matchTitle || matchEng || matchDirector || matchGenre || matchKeyword || matchSynopsis;
                }

                return true;
            });

            // 2. 정렬
            filtered.sort((a, b) => {
                if (sortBy === 'rating') return b.rating - a.rating;
                if (sortBy === 'year_desc') return b.year - a.year;
                if (sortBy === 'year_asc') return a.year - b.year;
                return 0;
            });

            // 결과 수 업데이트
            resultCountEl.innerHTML = `총 <strong class="text-white">${filtered.length}</strong>편의 영화`;

            // 3. 화면 출력
            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(movie => {
                const countryObj = COUNTRIES.find(c => c.id === movie.country);
                const isBookmarked = state.bookmarks.includes(movie.id);

                return `
                    <article onclick="openModal(${movie.id})" class="group bg-cinema-900 border border-zinc-800/90 hover:border-zinc-700 rounded-2xl overflow-hidden flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-black/50 cursor-pointer">
                        <div>
                            <!-- 카드 상단 아트워크 배너 -->
                            <div class="relative h-44 bg-gradient-to-br ${movie.gradient} p-5 flex flex-col justify-between overflow-hidden">
                                <!-- 장식용 배경 패턴 -->
                                <div class="absolute -right-6 -bottom-6 opacity-10 group-hover:scale-110 transition-transform duration-500">
                                    <i data-lucide="clapperboard" class="w-32 h-32 text-white"></i>
                                </div>

                                <div class="flex items-center justify-between z-10">
                                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-black/50 backdrop-blur-md text-xs font-medium text-zinc-200 border border-white/10">
                                        <span>${countryObj.flag}</span>
                                        <span>${countryObj.name}</span>
                                    </span>

                                    <button onclick="toggleBookmark(event, ${movie.id})" class="w-8 h-8 rounded-full bg-black/50 hover:bg-black/80 backdrop-blur-md flex items-center justify-center border border-white/10 transition-colors" title="찜하기">
                                        <i data-lucide="bookmark" class="w-4 h-4 ${isBookmarked ? 'fill-rose-500 text-rose-500' : 'text-zinc-300'}"></i>
                                    </button>
                                </div>

                                <div class="z-10">
                                    <div class="flex items-center gap-2 text-xs text-zinc-300/90 mb-1">
                                        <span>${movie.year}</span>
                                        <span>•</span>
                                        <span>${movie.genre.slice(0, 2).join(', ')}</span>
                                    </div>
                                    <h3 class="text-xl font-bold text-white group-hover:text-rose-400 transition-colors line-clamp-1">
                                        ${movie.title}
                                    </h3>
                                </div>
                            </div>

                            <!-- 카드 본문 -->
                            <div class="p-5">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-xs text-zinc-400">감독: <strong class="text-zinc-300 font-medium">${movie.director}</strong></span>
                                    <div class="flex items-center gap-1 text-amber-400 text-sm font-bold">
                                        <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                                        <span>${movie.rating.toFixed(1)}</span>
                                    </div>
                                </div>

                                <p class="text-zinc-400 text-sm line-clamp-2 mb-4 leading-relaxed">
                                    ${movie.synopsis}
                                </p>
                            </div>
                        </div>

                        <!-- 키워드 태그 영역 -->
                        <div class="px-5 pb-5 pt-0 flex flex-wrap gap-1.5">
                            ${movie.keywords.slice(0, 4).map(kw => {
                                const isMatch = state.searchQuery && kw.toLowerCase().includes(state.searchQuery.toLowerCase().replace(/^#/, ''));
                                return `
                                    <span class="text-xs px-2.5 py-1 rounded-md ${isMatch ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40 font-medium' : 'bg-cinema-800 text-zinc-400 border border-zinc-700/50'}">
                                        #${kw}
                                    </span>
                                `;
                            }).join('')}
                        </div>
                    </article>
                `;
            }).join('');

            lucide.createIcons();
        }

        // 영화 상세 모달 열기
        function openModal(movieId) {
            const movie = MOVIES.find(m => m.id === movieId);
            if (!movie) return;

            const countryObj = COUNTRIES.find(c => c.id === movie.country);
            const isBookmarked = state.bookmarks.includes(movie.id);
            const modal = document.getElementById('movieModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <!-- 모달 상단 비주얼 헤더 -->
                <div class="relative h-56 sm:h-64 bg-gradient-to-br ${movie.gradient} p-6 sm:p-8 flex flex-col justify-end">
                    <div class="absolute inset-0 bg-gradient-to-t from-cinema-900 via-cinema-900/40 to-transparent"></div>
                    
                    <div class="relative z-10">
                        <div class="flex flex-wrap items-center gap-2 mb-2.5">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md text-xs font-medium text-white border border-white/10">
                                <span>${countryObj.flag}</span>
                                <span>${countryObj.name}</span>
                            </span>
                            <span class="px-3 py-1 rounded-full bg-black/60 backdrop-blur-md text-xs font-medium text-zinc-300 border border-white/10">
                                ${movie.year}년 개봉
                            </span>
                            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-amber-500/20 backdrop-blur-md text-xs font-bold text-amber-400 border border-amber-500/30">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i>
                                ${movie.rating.toFixed(1)}
                            </span>
                        </div>

                        <h2 class="text-2xl sm:text-3xl font-bold text-white mb-1">${movie.title}</h2>
                        <p class="text-sm text-zinc-400">${movie.engTitle} • 감독 ${movie.director}</p>
                    </div>
                </div>

                <!-- 모달 상세 내용 -->
                <div class="p-6 sm:p-8 pt-4 space-y-6">
                    <!-- 추천 포인트 박스 -->
                    <div class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20">
                        <div class="flex items-center gap-2 text-rose-400 font-semibold text-sm mb-1.5">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                            <span>큐레이터 추천 포인트</span>
                        </div>
                        <p class="text-zinc-200 text-sm leading-relaxed">${movie.reason}</p>
                    </div>

                    <!-- 줄거리 -->
                    <div>
                        <h4 class="text-sm font-semibold text-zinc-300 mb-2">줄거리</h4>
                        <p class="text-zinc-400 text-sm leading-relaxed">${movie.synopsis}</p>
                    </div>

                    <!-- 장르 및 키워드 -->
                    <div>
                        <h4 class="text-sm font-semibold text-zinc-300 mb-2.5">관련 키워드 (클릭 시 검색)</h4>
                        <div class="flex flex-wrap gap-2">
                            ${movie.keywords.map(kw => `
                                <button onclick="closeModal(); applyKeyword('${kw}');" class="px-3 py-1.5 rounded-xl bg-cinema-800 hover:bg-rose-600 text-zinc-300 hover:text-white text-xs font-medium border border-zinc-700 hover:border-rose-500 transition-colors">
                                    #${kw}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 하단 액션 버튼 -->
                    <div class="pt-4 border-t border-zinc-800 flex items-center justify-end gap-3">
                        <button onclick="toggleBookmark(event, ${movie.id}); openModal(${movie.id});" class="flex items-center gap-2 px-5 py-2.5 rounded-xl font-medium text-sm transition-all ${isBookmarked ? 'bg-rose-600 text-white' : 'bg-cinema-800 hover:bg-cinema-700 text-zinc-200 border border-zinc-700'}">
                            <i data-lucide="bookmark" class="w-4 h-4 ${isBookmarked ? 'fill-white' : ''}"></i>
                            <span>${isBookmarked ? '찜 완료됨' : '나중에 볼 영화 찜하기'}</span>
                        </button>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('movieModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // 토스트 알림 메시지
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-cinema-800 text-white text-sm px-4 py-3 rounded-xl shadow-2xl border border-zinc-700 flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 opacity-0';
            toast.innerHTML = `
                <i data-lucide="check-circle-2" class="w-4 h-4 text-rose-400 shrink-0"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
